<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=2" sizes="16x16 32x32">
  <link rel="icon" type="image/png" href="{{ '/favicon-16x16.png' | relative_url }}?v=2" sizes="16x16">
  <link rel="icon" type="image/png" href="{{ '/favicon-32x32.png' | relative_url }}?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v=2" sizes="180x180">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quattrocento+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

  <title>{{ site.title | escape }}{% if page.title and page.title != site.title %} | {{ page.title | escape }}{% endif %}</title>
  {% seo title=false %}
</head>
