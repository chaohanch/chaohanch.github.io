<figure class="about-profile">
  <div class="profile-photo">
    <img src="{{ page.image | prepend: '/assets/img/' | relative_url }}" alt="Portrait of {{ site.title | escape }}" width="800" height="600">
    {% if page.image_hover %}
      <img class="profile-photo__hover" src="{{ page.image_hover | prepend: '/assets/img/' | relative_url }}" alt="" width="800" height="600">
    {% endif %}
  </div>
  <figcaption>
    <span class="profile-name">{{ site.title | escape }}</span>
    <span>{{ page.position | escape }}</span>
    <span><a href="{{ page.affiliation_url | escape }}">{{ page.affiliation | escape }}</a></span>
  </figcaption>
</figure>
