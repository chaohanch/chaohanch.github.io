{% assign profile = site.data.settings.profile %}
<figure class="about-profile">
  <div class="profile-photo">
    <img src="{{ profile.image | prepend: '/assets/img/' | relative_url }}" alt="Portrait of {{ site.title | escape }}" width="800" height="600">
    {% if profile.image_hover %}
      <img class="profile-photo__hover" src="{{ profile.image_hover | prepend: '/assets/img/' | relative_url }}" alt="" width="800" height="600">
    {% endif %}
  </div>
  <figcaption>
    <span class="profile-name">{{ site.title | escape }}</span>
    <span>{{ profile.position | escape }}</span>
    <span><a href="{{ profile.affiliation_url | escape }}">{{ profile.affiliation | escape }}</a></span>
  </figcaption>
</figure>
