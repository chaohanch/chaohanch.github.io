{% for item in site.data.settings.social %}
  {% assign first_char = item.link | slice: 0 %}
  {% if first_char == '/' %}
    <a href="{{ item.link | relative_url }}" aria-label="{{ item.name | escape }}"><i class="{{ item.icon }}" aria-hidden="true"></i></a>
  {% else %}
    <a href="{{ item.link | escape }}" aria-label="{{ item.name | escape }}" target="_blank" rel="noopener"><i class="{{ item.icon }}" aria-hidden="true"></i></a>
  {% endif %}
{% endfor %}
